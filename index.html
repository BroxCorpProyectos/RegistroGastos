<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Gastos</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    label { display: block; margin-top: 10px; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; }
    button { margin-top: 15px; padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; }
    button:hover { background: #45a049; }
    #materialSection { display: none; margin-top: 15px; padding: 10px; border: 1px solid #ccc; }
    .material-item { margin-top: 10px; padding: 10px; border: 1px dashed #aaa; }
  </style>
</head>
<body>
  <h2>Registro de Gastos</h2>
  <form id="gastosForm">
    <label>Proyecto:</label>
    <select name="proyecto" required>
      <option value="">Seleccione un proyecto</option>
      <option value="Construcción">Construcción</option>
      <option value="Oficina">Oficina</option>
      <option value="Marketing">Marketing</option>
      <option value="Investigación">Investigación</option>
    </select>

    <label>Categoría:</label>
    <select id="categoria" name="categoria" required>
      <option value="Alimentación">Alimentación</option>
      <option value="Transporte">Transporte</option>
      <option value="Servicios">Servicios</option>
      <option value="Material">Material</option>
    </select>

    <div id="materialSection">
      <h3>Materiales</h3>
      <div id="materialList"></div>
    </div>

    <label>Monto:</label>
    <input type="number" name="monto" required>

    <label>Observación:</label>
    <textarea name="observacion"></textarea>

    <label>Foto / Evidencia:</label>
    <input type="file" name="foto">

    <button type="submit">Registrar gasto</button>
  </form>

  <script>
    const categoria = document.getElementById("categoria");
    const materialSection = document.getElementById("materialSection");
    const materialList = document.getElementById("materialList");

    categoria.addEventListener("change", function() {
      if (this.value === "Material") {
        let cantidad = prompt("¿Cuántos materiales deseas registrar?");
        cantidad = parseInt(cantidad);
        if (!isNaN(cantidad) && cantidad > 0) {
          materialSection.style.display = "block";
          materialList.innerHTML = "";
          for (let i = 1; i <= cantidad; i++) {
            materialList.innerHTML += `
              <div class="material-item">
                <label>Material ${i}:</label>
                <input type="text" name="material_${i}">
                <label>Cantidad:</label>
                <input type="number" name="cantidad_${i}">
                <label>Precio unitario:</label>
                <input type="number" name="precioUnitario_${i}">
              </div>
            `;
          }
        }
      } else {
        materialSection.style.display = "none";
        materialList.innerHTML = "";
      }
    });

    // Enviar datos al Google Apps Script
    document.getElementById("gastosForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      fetch("https://script.google.com/macros/s/AKfycbz34L82tDWET4GA2qFlzZoW9muKQ1HpjnEs1QUtmiMNA4Pr0QHsQBuvI8uoA9DhAUFt/exec", {
        method: "POST",
        body: formData
      })
      .then(response => response.text())
      .then(data => alert("Registro enviado correctamente"))
      .catch(error => alert("Error al enviar: " + error));
    });
  </script>
</body>
</html>
